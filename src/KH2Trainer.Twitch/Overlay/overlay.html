<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KH2 Trainer · Twitch overlay</title>
<!--
  OBS browser source. Width 420, height 720 works well; the background is transparent.
  URL options: ?side=left (default right), ?queue=0 hides the queue, ?scale=1.25 enlarges everything.
-->
<style>
  :root { --scale: 1; --side: flex-end; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 600 calc(15px * var(--scale)) / 1.3 "Segoe UI", system-ui, sans-serif; color: #fff;
         display: flex; flex-direction: column; align-items: var(--side); gap: calc(8px * var(--scale)); padding: calc(12px * var(--scale)); }
  .card { width: calc(380px * var(--scale)); display: flex; gap: calc(10px * var(--scale)); align-items: center;
          padding: calc(10px * var(--scale)) calc(12px * var(--scale)); border-radius: calc(12px * var(--scale));
          background: rgba(14, 17, 23, .82); border-left: calc(4px * var(--scale)) solid var(--color, #5b9bff);
          box-shadow: 0 4px 18px rgba(0, 0, 0, .35); animation: enter .35s ease-out; }
  .icon { flex: none; width: calc(46px * var(--scale)); height: calc(46px * var(--scale)); border-radius: calc(10px * var(--scale));
          background: var(--color, #5b9bff) center / cover no-repeat; display: grid; place-items: center; font-size: calc(20px * var(--scale)); }
  .body { flex: 1; min-width: 0; }
  .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail { color: #e9c46a; font-weight: 600; }
  .sub { font-weight: 500; font-size: .8em; color: #c6cfdb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: calc(5px * var(--scale)); border-radius: 3px; background: rgba(255, 255, 255, .15); margin-top: calc(6px * var(--scale)); overflow: hidden; }
  .bar > div { height: 100%; background: var(--color, #5b9bff); transition: width .5s linear; }
  .time { flex: none; font-variant-numeric: tabular-nums; font-size: .9em; color: #fff; }
  .heading { width: calc(380px * var(--scale)); font-size: .75em; letter-spacing: .08em; color: #c6cfdb; text-shadow: 0 1px 3px #000; margin-top: calc(4px * var(--scale)); }
  .queued { opacity: .85; padding-top: calc(6px * var(--scale)); padding-bottom: calc(6px * var(--scale)); }
  .queued .icon { width: calc(30px * var(--scale)); height: calc(30px * var(--scale)); font-size: calc(14px * var(--scale)); }
  .toast { background: rgba(30, 36, 48, .92); }
  @keyframes enter { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const root = document.documentElement.style;
  root.setProperty('--scale', Math.min(3, Math.max(.5, Number(params.get('scale')) || 1)));
  root.setProperty('--side', params.get('side') === 'left' ? 'flex-start' : 'flex-end');
  const showQueue = params.get('queue') !== '0';
  const symbols = { '#1F8B4C': '❤', '#C0392B': '☠', '#8E44AD': '★', '#D68910': '⚡' };

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function icon(item) {
    const node = element('div', 'icon');
    if (item.image) node.style.backgroundImage = `url("/image/${encodeURIComponent(item.key)}")`;
    else node.textContent = symbols[item.color] || '✦';
    return node;
  }
  function card(item, extraClass) {
    const node = element('div', 'card' + (extraClass ? ' ' + extraClass : ''));
    node.style.setProperty('--color', item.color);
    node.dataset.key = (extraClass || 'active') + ':' + item.key + ':' + (item.viewer || item.viewers || item.time || '');
    node.append(icon(item));
    return node;
  }
  function render(state) {
    const now = Date.now();
    const nodes = [];
    for (const event of state.events) {
      if (now - event.time > 6000) continue;
      const toast = card(event, 'toast');
      const body = element('div', 'body');
      body.append(element('div', 'title', event.text));
      toast.append(body);
      nodes.push(toast);
      break; // Only the newest event is shown as a toast.
    }
    for (const effect of state.active) {
      const node = card(effect);
      const body = element('div', 'body');
      const title = element('div', 'title', effect.title);
      if (effect.detail) { title.append(' · '); title.append(element('span', 'detail', effect.detail)); }
      body.append(title, element('div', 'sub', effect.starting ? 'Starting…' : effect.viewers));
      if (effect.duration > 0) {
        const bar = element('div', 'bar'), fill = element('div');
        fill.style.width = `${Math.max(0, Math.min(100, effect.remaining / effect.duration * 100))}%`;
        bar.append(fill); body.append(bar);
      }
      node.append(body);
      if (effect.duration > 0 && !effect.starting) node.append(element('div', 'time', `${Math.ceil(effect.remaining)}s`));
      nodes.push(node);
    }
    if (showQueue && state.queue.length) {
      nodes.push(element('div', 'heading', 'UP NEXT'));
      for (const item of state.queue.slice(0, 5)) {
        const node = card(item, 'queued');
        const body = element('div', 'body');
        body.append(element('div', 'title', item.title), element('div', 'sub', `${item.viewer} · ${item.status}`));
        node.append(body);
        nodes.push(node);
      }
    }
    // Keep existing nodes (and their animation state) where the content key is unchanged.
    const existing = new Map([...document.body.querySelectorAll('.card, .heading')].map(n => [n.dataset.key || n.textContent, n]));
    const fragment = document.createDocumentFragment();
    for (const node of nodes) {
      const key = node.dataset.key || node.textContent;
      const old = existing.get(key);
      if (old && old.className === node.className) { old.replaceChildren(...node.childNodes); fragment.append(old); }
      else fragment.append(node);
    }
    for (const script of document.body.querySelectorAll('script')) fragment.append(script);
    document.body.replaceChildren(fragment);
  }
  async function poll() {
    try {
      const response = await fetch('/state.json', { cache: 'no-store' });
      if (response.ok) render(await response.json());
    } catch { /* The trainer is closed; try again shortly. */ }
    setTimeout(poll, 500);
  }
  poll();
</script>
</body>
</html>
