<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KH2 Trainer · Twitch overlay</title>
<!--
  OBS browser source. Width 420, height 720 works well; the background is transparent.
  URL options: ?side=left (default right), ?queue=0 hides the queue, ?scale=1.25 enlarges everything.
-->
<style>
  :root { --scale: 1; --side: flex-end; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 600 calc(15px * var(--scale)) / 1.3 "Segoe UI", system-ui, sans-serif; color: #fff; padding: calc(12px * var(--scale)); }
  #cards { display: flex; flex-direction: column; align-items: var(--side); gap: calc(8px * var(--scale)); }
  .card { width: calc(380px * var(--scale)); display: flex; gap: calc(10px * var(--scale)); align-items: center;
          padding: calc(10px * var(--scale)) calc(12px * var(--scale)); border-radius: calc(12px * var(--scale));
          background: rgba(14, 17, 23, .82); border-left: calc(4px * var(--scale)) solid var(--color, #5b9bff);
          box-shadow: 0 4px 18px rgba(0, 0, 0, .35); }
  /* Only cards that just appeared slide in; updates never replay the animation. */
  .new { animation: enter .35s ease-out; }
  .icon { flex: none; width: calc(46px * var(--scale)); height: calc(46px * var(--scale)); border-radius: calc(10px * var(--scale));
          background: var(--color, #5b9bff) center / cover no-repeat; display: grid; place-items: center; font-size: calc(20px * var(--scale)); }
  .body { flex: 1; min-width: 0; }
  .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail { color: #e9c46a; font-weight: 600; }
  .sub { font-weight: 500; font-size: .8em; color: #c6cfdb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: calc(5px * var(--scale)); border-radius: 3px; background: rgba(255, 255, 255, .15); margin-top: calc(6px * var(--scale)); overflow: hidden; }
  .bar > div { height: 100%; background: var(--color, #5b9bff); transition: width .5s linear; }
  .time { flex: none; font-variant-numeric: tabular-nums; font-size: .9em; color: #fff; }
  .heading { width: calc(380px * var(--scale)); font-size: .75em; letter-spacing: .08em; color: #c6cfdb; text-shadow: 0 1px 3px #000; margin-top: calc(4px * var(--scale)); }
  .queued { opacity: .85; padding-top: calc(6px * var(--scale)); padding-bottom: calc(6px * var(--scale)); }
  .queued .icon { width: calc(30px * var(--scale)); height: calc(30px * var(--scale)); font-size: calc(14px * var(--scale)); }
  .toast { background: rgba(30, 36, 48, .92); }
  [hidden] { display: none !important; }
  @keyframes enter { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="cards"></div>
<script>
  const params = new URLSearchParams(location.search);
  const root = document.documentElement.style;
  root.setProperty('--scale', Math.min(3, Math.max(.5, Number(params.get('scale')) || 1)));
  root.setProperty('--side', params.get('side') === 'left' ? 'flex-start' : 'flex-end');
  const showQueue = params.get('queue') !== '0';
  const symbols = { '#1F8B4C': '❤', '#C0392B': '☠', '#8E44AD': '★', '#D68910': '⚡' };
  const container = document.getElementById('cards');

  // All text goes through textContent, so viewer names and titles can never inject markup.
  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function card(item, kind) {
    const node = element('div', `card ${kind} new`);
    node.addEventListener('animationend', () => node.classList.remove('new'), { once: true });
    node.style.setProperty('--color', item.color);
    const icon = element('div', 'icon');
    if (item.image) icon.style.backgroundImage = `url("/image/${encodeURIComponent(item.key)}")`;
    else icon.textContent = symbols[item.color] || '✦';
    node.append(icon);
    return node;
  }
  function setTitle(node, title, detail) {
    node.textContent = title;
    if (detail) { node.append(' · '); node.append(element('span', 'detail', detail)); }
  }
  function toastCard(event) {
    const node = card(event, 'toast');
    const body = element('div', 'body');
    body.append(element('div', 'title', event.text));
    node.append(body);
    return node;
  }
  function activeCard(effect) {
    const node = card(effect, 'active');
    const body = element('div', 'body'), bar = element('div', 'bar');
    bar.append(element('div'));
    body.append(element('div', 'title'), element('div', 'sub'), bar);
    node.append(body, element('div', 'time'));
    return node;
  }
  function updateActive(node, effect) {
    setTitle(node.querySelector('.title'), effect.title, effect.detail);
    node.querySelector('.sub').textContent = effect.starting ? 'Starting…' : effect.viewers;
    const timed = effect.duration > 0;
    node.querySelector('.bar').hidden = !timed;
    node.querySelector('.bar > div').style.width = `${timed ? Math.max(0, Math.min(100, effect.remaining / effect.duration * 100)) : 0}%`;
    const time = node.querySelector('.time');
    time.hidden = !timed || effect.starting;
    time.textContent = `${Math.ceil(effect.remaining)}s`;
  }
  function queuedCard(item) {
    const node = card(item, 'queued');
    const body = element('div', 'body');
    body.append(element('div', 'title'), element('div', 'sub'));
    node.append(body);
    return node;
  }
  function updateQueued(node, item) {
    node.querySelector('.title').textContent = item.title;
    node.querySelector('.sub').textContent = `${item.viewer} · ${item.status}`;
  }
  function render(state) {
    const now = Date.now();
    const wanted = [];
    const toast = state.events.find(event => now - event.time <= 6000); // Only the newest event is shown as a toast.
    if (toast) wanted.push({ key: `toast:${toast.time}:${toast.key}`, make: () => toastCard(toast) });
    for (const effect of state.active) wanted.push({ key: `active:${effect.key}`, make: () => activeCard(effect), update: node => updateActive(node, effect) });
    if (showQueue && state.queue.length) {
      wanted.push({ key: 'heading', make: () => element('div', 'heading', 'UP NEXT') });
      for (const item of state.queue.slice(0, 5)) wanted.push({ key: `queued:${item.id}`, make: () => queuedCard(item), update: node => updateQueued(node, item) });
    }
    // Update cards in place; only new cards are created and only misplaced ones move.
    const keys = new Set(wanted.map(w => w.key));
    const existing = new Map();
    for (const node of [...container.children]) {
      if (keys.has(node.dataset.key)) existing.set(node.dataset.key, node);
      else node.remove();
    }
    let previous = null;
    for (const w of wanted) {
      let node = existing.get(w.key);
      if (!node) { node = w.make(); node.dataset.key = w.key; }
      if (w.update) w.update(node);
      const expected = previous ? previous.nextSibling : container.firstChild;
      if (node !== expected) container.insertBefore(node, expected);
      previous = node;
    }
  }
  async function poll() {
    try {
      const response = await fetch('/state.json', { cache: 'no-store' });
      if (response.ok) render(await response.json());
    } catch { /* The trainer is closed; try again shortly. */ }
    setTimeout(poll, 500);
  }
  poll();
</script>
</body>
</html>
